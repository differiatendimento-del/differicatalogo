<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Differi Imóveis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#1a4f7a;--azul2:#2d7ab5;--dourado:#c49a3c;
  --bg:#f7f6f3;--branco:#fff;--c1:#f0eeea;--c2:#e2dfd9;--c3:#9b9589;
  --texto:#1c1a17;--texto2:#5c5850;--radius:10px;
  --shadow:0 2px 12px rgba(0,0,0,.08);
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--texto);min-height:100vh}
.header{background:var(--azul);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.logo{display:flex;align-items:center;gap:10px;color:#fff}
.logo strong{font-size:17px;font-weight:600}
.logo span{font-size:11px;color:rgba(255,255,255,.55);font-weight:300}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;border:none;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;text-decoration:none}
.btn-gold{background:var(--dourado);color:#fff}.btn-gold:hover{background:#b08830}
.btn-white{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.25)}.btn-white:hover{background:rgba(255,255,255,.25)}
.btn-green{background:#25D366;color:#fff}.btn-green:hover{background:#1fb956}
.btn-blue{background:var(--azul2);color:#fff}.btn-blue:hover{background:#256d9e}
.btn-light{background:var(--c1);color:var(--texto2)}.btn-light:hover{background:var(--c2)}
.btn-danger{background:#fce8e8;color:#c0392b}.btn-danger:hover{background:#f5c6c6}
.btn-sm{padding:5px 10px;font-size:12px}

.sync-bar{background:var(--azul2);color:#fff;text-align:center;font-size:12px;padding:6px;display:none}
.sync-bar.show{display:block}

.filtros{background:var(--branco);border-bottom:1px solid var(--c2);padding:10px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:58px;z-index:99}
.tab{padding:6px 14px;border-radius:20px;border:1px solid var(--c2);background:var(--branco);color:var(--texto2);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
.tab:hover{border-color:var(--azul2);color:var(--azul)}
.tab.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.sel{padding:6px 12px;border-radius:20px;border:1px solid var(--c2);background:var(--branco);color:var(--texto);font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;outline:none}
.sel:focus{border-color:var(--azul2)}
.search{padding:6px 14px;border-radius:20px;border:1px solid var(--c2);background:var(--branco);color:var(--texto);font-size:13px;font-family:'Inter',sans-serif;outline:none;min-width:180px}
.search:focus{border-color:var(--azul2)}
.badge-count{margin-left:auto;font-size:12px;color:var(--c3)}

.main{padding:20px;max-width:1400px;margin:0 auto}
.sec-label{font-size:12px;font-weight:600;color:var(--c3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px;padding-bottom:7px;border-bottom:1px solid var(--c2);display:flex;align-items:center;gap:8px}
.sec-label em{background:var(--c2);color:var(--texto2);border-radius:10px;padding:1px 7px;font-style:normal;font-size:11px}
.sec{margin-bottom:32px}
.bairro-label{font-size:12px;font-weight:600;color:var(--c3);margin-bottom:10px;margin-top:16px;padding:3px 0;border-bottom:1px dashed var(--c2);display:flex;align-items:center;gap:6px}
.bairro-label em{background:var(--c2);border-radius:8px;padding:1px 6px;font-style:normal;font-size:11px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--branco);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s;cursor:pointer}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.thumb{height:170px;background:linear-gradient(135deg,var(--azul),var(--azul2));position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.thumb-icon{opacity:.25}
.cat-tag{position:absolute;top:9px;left:9px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.drive-tag{position:absolute;top:9px;right:9px;background:rgba(255,255,255,.2);color:#fff;padding:3px 7px;border-radius:20px;font-size:10px;display:flex;align-items:center;gap:3px}
.cat-lancamento{background:#FF6B35;color:#fff}
.cat-planta{background:#2d7ab5;color:#fff}
.cat-pronto{background:#2d8a4e;color:#fff}
.cat-drive{background:rgba(66,133,244,.85);color:#fff}
.cbody{padding:13px 15px}
.cnome{font-size:14px;font-weight:600;margin-bottom:3px;line-height:1.3}
.cbairro{font-size:12px;color:var(--c3);margin-bottom:8px}
.cmeta{display:flex;gap:10px;font-size:12px;color:var(--texto2);margin-bottom:10px;flex-wrap:wrap}
.cpreco{font-size:16px;font-weight:600;color:var(--azul);margin-bottom:10px}
.cpreco small{font-size:11px;font-weight:400;color:var(--c3)}
.cactions{display:flex;gap:5px}
.cactions .btn{flex:1;justify-content:center;font-size:12px;padding:6px 8px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--branco);border-radius:14px;width:580px;max-width:100%;margin:auto}
.mhead{background:var(--azul);padding:18px 22px;display:flex;align-items:center;justify-content:space-between;border-radius:14px 14px 0 0}
.mhead h2{color:#fff;font-size:16px;font-weight:600}
.mclose{background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:18px;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center}
.mbody{padding:20px 22px}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fg label{font-size:11px;font-weight:600;color:var(--texto2);text-transform:uppercase;letter-spacing:.4px}
.fg input,.fg select,.fg textarea{padding:9px 11px;border-radius:8px;border:1.5px solid var(--c2);font-family:'Inter',sans-serif;font-size:13px;color:var(--texto);background:var(--branco);outline:none;transition:border-color .15s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--azul2)}
.fg textarea{min-height:70px;resize:vertical}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
.mfoot{padding:14px 22px;border-top:1px solid var(--c2);display:flex;justify-content:flex-end;gap:8px}
.err{color:#c0392b;font-size:12px;padding:8px;background:#fce8e8;border-radius:7px;margin-top:8px;display:none}

.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.det-item label{font-size:11px;font-weight:600;color:var(--c3);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:2px}
.det-item span{font-size:14px;font-weight:500}
.det-desc{font-size:13px;color:var(--texto2);line-height:1.7;padding:11px;background:var(--c1);border-radius:8px;margin-bottom:14px}
.files{margin-top:14px;padding-top:14px;border-top:1px solid var(--c2)}
.files h4{font-size:11px;font-weight:600;color:var(--c3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.flinks{display:flex;flex-wrap:wrap;gap:6px}
.flink{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:8px;background:var(--c1);color:var(--texto2);font-size:12px;font-weight:500;text-decoration:none;border:1px solid var(--c2);transition:all .15s}
.flink:hover{background:var(--azul);color:#fff;border-color:var(--azul)}

.empty{text-align:center;padding:52px 20px;color:var(--c3)}
.empty p{font-size:14px;margin-top:10px}
.loading{text-align:center;padding:52px 20px;color:var(--c3);font-size:14px}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--c2);border-top-color:var(--azul2);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;bottom:20px;right:20px;background:var(--azul);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:500;z-index:999;display:none;box-shadow:0 4px 16px rgba(0,0,0,.2);animation:fadeup .2s ease}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:600px){
  .filtros{padding:8px 12px}
  .main{padding:12px}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .thumb{height:120px}
  .cbody{padding:9px 11px}
  .cnome{font-size:13px}
  .cpreco{font-size:14px}
  .fgrid{grid-template-columns:1fr}
  .full{grid-column:1}
  .header{padding:0 12px}
}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none"><rect width="26" height="26" rx="6" fill="rgba(255,255,255,.15)"/><path d="M6 19V10l7-4 7 4v9" stroke="white" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 19v-5h6v5" stroke="white" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <div><strong>Differi Imóveis</strong> <span>· Catálogo</span></div>
  </div>
  <div style="display:flex;gap:6px">
    <button class="btn btn-white btn-sm" onclick="sincronizarDrive()" id="btn-sync">⟳ Sincronizar</button>
    <button class="btn btn-gold btn-sm" onclick="abrirCadastro()">+ Novo</button>
  </div>
</header>

<div class="sync-bar" id="sync-bar">⏳ Sincronizando com Google Drive...</div>

<div class="filtros">
  <button class="tab on" onclick="setTab('',this)">Todos</button>
  <button class="tab" onclick="setTab('lancamento',this)">🔥 Lançamentos</button>
  <button class="tab" onclick="setTab('planta',this)">🏗 Na planta</button>
  <button class="tab" onclick="setTab('pronto',this)">🏠 Prontos</button>
  <select class="sel" id="f-bairro" onchange="render()"><option value="">Todos os bairros</option></select>
  <select class="sel" id="f-cidade" onchange="render()">
    <option value="">Todas as cidades</option>
    <option>João Pessoa</option><option>Cabedelo</option><option>Bayeux</option><option>Conde</option>
  </select>
  <input class="search" id="f-busca" placeholder="🔍 Buscar..." oninput="render()">
  <span class="badge-count" id="badge"></span>
</div>

<main class="main" id="main"></main>

<!-- MODAL CADASTRO -->
<div class="overlay" id="ov-cad">
  <div class="modal">
    <div class="mhead"><h2 id="cad-title">Cadastrar Imóvel</h2><button class="mclose" onclick="fecharCadastro()">×</button></div>
    <div class="mbody">
      <div class="fgrid">
        <div class="fg full"><label>Nome *</label><input id="c-nome" placeholder="Ex: Edifício Vista Mar"></div>
        <div class="fg"><label>Cidade *</label><select id="c-cidade"><option>João Pessoa</option><option>Cabedelo</option><option>Bayeux</option><option>Conde</option></select></div>
        <div class="fg"><label>Bairro *</label><input id="c-bairro" placeholder="Ex: Manaíra"></div>
        <div class="fg"><label>Categoria *</label><select id="c-cat"><option value="lancamento">🔥 Lançamento</option><option value="planta">🏗 Na planta</option><option value="pronto">🏠 Pronto</option></select></div>
        <div class="fg"><label>Construtora</label><input id="c-const" placeholder="Ex: Moura Dubeux"></div>
        <div class="fg"><label>Preço a partir (R$)</label><input type="number" id="c-preco" placeholder="450000"></div>
        <div class="fg"><label>Metragem (m²)</label><input id="c-m2" placeholder="Ex: 65 a 110"></div>
        <div class="fg"><label>Quartos</label><input id="c-qtos" placeholder="Ex: 2 ou 3"></div>
        <div class="fg"><label>Vagas</label><input id="c-vagas" placeholder="Ex: 1 ou 2"></div>
        <div class="fg"><label>Entrega prevista</label><input id="c-entrega" placeholder="Ex: Dez/2026"></div>
        <div class="fg full"><label>Descrição / Diferenciais</label><textarea id="c-desc" placeholder="Localização, diferenciais, lazer..."></textarea></div>
        <div class="fg full"><label>Foto principal (URL)</label><input id="c-foto" placeholder="https://..."></div>
        <div class="fg"><label>Book (Drive)</label><input id="c-book" placeholder="https://drive.google.com/..."></div>
        <div class="fg"><label>Tabela de preços</label><input id="c-tabela" placeholder="https://drive.google.com/..."></div>
        <div class="fg"><label>Plantas</label><input id="c-plantas" placeholder="https://drive.google.com/..."></div>
        <div class="fg"><label>Fotos (Drive)</label><input id="c-fotos" placeholder="https://drive.google.com/..."></div>
        <div class="fg full"><label>WhatsApp (somente números)</label><input id="c-wpp" placeholder="5583999999999"></div>
      </div>
      <div class="err" id="cad-err"></div>
    </div>
    <div class="mfoot">
      <button class="btn btn-light" onclick="fecharCadastro()">Cancelar</button>
      <button class="btn btn-gold" onclick="salvar()" id="btn-salvar">Salvar imóvel</button>
    </div>
  </div>
</div>

<!-- MODAL DETALHE -->
<div class="overlay" id="ov-det">
  <div class="modal" style="width:660px">
    <div class="mhead"><h2 id="det-nome">Detalhes</h2><button class="mclose" onclick="fecharDetalhe()">×</button></div>
    <div class="mbody" id="det-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════
// CONFIGURAÇÃO — substitua com suas credenciais
// ═══════════════════════════════════════════
const GAPI_KEY   = 'AIzaSyCFhxxq38QX8CttsFTN6WnqcVD-e1GAtps';
const PASTA_ROOT = '15bsLFxjG6GYBtu-oixJBkFxa-4xV6sKa';
const DRIVE_BASE = 'https://www.googleapis.com/drive/v3';

// ═══════════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════════
let imoveis   = JSON.parse(localStorage.getItem('differi_imoveis') || '[]');
let driveItens= JSON.parse(localStorage.getItem('differi_drive')   || '[]');
let tabAtiva  = '';
let editId    = null;

function todos(){ return [...driveItens, ...imoveis]; }

// ═══════════════════════════════════════════
// GOOGLE DRIVE API
// ═══════════════════════════════════════════
async function driveList(folderId){
  const url = `${DRIVE_BASE}/files?q='${folderId}'+in+parents+and+trashed=false&fields=files(id,name,mimeType,thumbnailLink,webViewLink,webContentLink)&key=${GAPI_KEY}&pageSize=200`;
  const r = await fetch(url);
  if(!r.ok) throw new Error('Drive API erro: ' + r.status);
  const d = await r.json();
  return d.files || [];
}

function extrairInfoNome(nome){
  // Tenta inferir categoria pelo nome da pasta/arquivo
  const n = nome.toLowerCase();
  if(n.includes('lançamento')||n.includes('lancamento')||n.includes('lançamento')) return 'lancamento';
  if(n.includes('planta')||n.includes('construção')||n.includes('construcao')) return 'planta';
  if(n.includes('pronto')||n.includes('entregue')) return 'pronto';
  return 'planta'; // default
}

function isImagem(f){
  return f.mimeType && f.mimeType.startsWith('image/');
}
function isPasta(f){
  return f.mimeType === 'application/vnd.google-apps.folder';
}

async function sincronizarDrive(){
  const bar = document.getElementById('sync-bar');
  const btn = document.getElementById('btn-sync');
  bar.classList.add('show');
  btn.textContent = '⏳ Sync...';
  btn.disabled = true;

  try {
    // 1. Listar subpastas da pasta raiz (bairros)
    const subpastas = await driveList(PASTA_ROOT);
    const novosItens = [];

    for(const pasta of subpastas){
      if(!isPasta(pasta)) continue;
      const nomePasta = pasta.name;

      // 2. Listar conteúdo de cada pasta de bairro
      let arquivos = [];
      try { arquivos = await driveList(pasta.id); } catch(e){ continue; }

      // Verificar se tem subpastas (empreendimentos) ou arquivos diretos
      const subEmp = arquivos.filter(isPasta);

      if(subEmp.length > 0){
        // Pasta organizada por empreendimento dentro do bairro
        for(const emp of subEmp){
          let empArqs = [];
          try { empArqs = await driveList(emp.id); } catch(e){}

          const foto = empArqs.find(isImagem);
          const book = empArqs.find(f => f.name.toLowerCase().includes('book') || f.name.toLowerCase().includes('apresent'));
          const tabela = empArqs.find(f => f.name.toLowerCase().includes('tabela') || f.name.toLowerCase().includes('preço') || f.name.toLowerCase().includes('preco'));
          const plantas = empArqs.find(f => f.name.toLowerCase().includes('planta'));

          novosItens.push({
            id: 'drive_' + emp.id,
            source: 'drive',
            nome: emp.name,
            bairro: nomePasta,
            cidade: 'João Pessoa',
            categoria: extrairInfoNome(emp.name + ' ' + nomePasta),
            foto: foto ? `https://drive.google.com/thumbnail?id=${foto.id}&sz=w400` : '',
            book: book ? book.webViewLink : '',
            tabela: tabela ? tabela.webViewLink : '',
            plantas: plantas ? plantas.webViewLink : '',
            fotos: `https://drive.google.com/drive/folders/${emp.id}`,
            driveUrl: `https://drive.google.com/drive/folders/${emp.id}`,
            preco: null, m2: '', quartos: '', vagas: '', entrega: '', desc: '', wpp: '',
            updatedAt: new Date().toISOString()
          });
        }
      } else {
        // Pasta de bairro com arquivos diretos — trata como um imóvel
        const foto = arquivos.find(isImagem);
        if(arquivos.length > 0){
          novosItens.push({
            id: 'drive_' + pasta.id,
            source: 'drive',
            nome: nomePasta,
            bairro: nomePasta,
            cidade: 'João Pessoa',
            categoria: extrairInfoNome(nomePasta),
            foto: foto ? `https://drive.google.com/thumbnail?id=${foto.id}&sz=w400` : '',
            fotos: `https://drive.google.com/drive/folders/${pasta.id}`,
            driveUrl: `https://drive.google.com/drive/folders/${pasta.id}`,
            book:'',tabela:'',plantas:'',
            preco:null,m2:'',quartos:'',vagas:'',entrega:'',desc:'',wpp:'',
            updatedAt: new Date().toISOString()
          });
        }
      }
    }

    driveItens = novosItens;
    localStorage.setItem('differi_drive', JSON.stringify(driveItens));
    localStorage.setItem('differi_sync_ts', Date.now().toString());
    toast(`✅ Drive sincronizado — ${driveItens.length} imóvel(is) carregado(s)`);
    render();
  } catch(err){
    toast('❌ Erro ao acessar Drive: ' + err.message, 4000);
    console.error(err);
  }

  bar.classList.remove('show');
  btn.textContent = '⟳ Sincronizar';
  btn.disabled = false;
}

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
function filtrados(){
  const busca  = document.getElementById('f-busca').value.toLowerCase();
  const bairro = document.getElementById('f-bairro').value;
  const cidade = document.getElementById('f-cidade').value;
  return todos().filter(i=>{
    if(tabAtiva && i.categoria !== tabAtiva) return false;
    if(bairro && i.bairro !== bairro) return false;
    if(cidade && (i.cidade||'João Pessoa') !== cidade) return false;
    if(busca && !i.nome.toLowerCase().includes(busca) && !(i.bairro||'').toLowerCase().includes(busca) && !(i.construtora||'').toLowerCase().includes(busca)) return false;
    return true;
  });
}

function render(){
  const lista = filtrados();
  // Atualiza bairros
  const sel = document.getElementById('f-bairro');
  const cur = sel.value;
  const bairros = [...new Set(todos().map(i=>i.bairro).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">Todos os bairros</option>' + bairros.map(b=>`<option${b===cur?' selected':''}>${b}</option>`).join('');
  document.getElementById('badge').textContent = lista.length + ' imóvel' + (lista.length!==1?'is':'');

  const el = document.getElementById('main');

  if(!lista.length){
    if(!todos().length){
      el.innerHTML = `<div class="loading"><div class="spinner"></div><p>Clique em <strong>⟳ Sincronizar</strong> para carregar os imóveis do Drive</p></div>`;
    } else {
      el.innerHTML = `<div class="empty"><p>Nenhum imóvel encontrado com esses filtros.</p></div>`;
    }
    return;
  }

  const cats = [
    {key:'lancamento',label:'🔥 Lançamentos'},
    {key:'planta',    label:'🏗 Na planta'},
    {key:'pronto',    label:'🏠 Prontos para morar'}
  ];

  if(tabAtiva){
    // Agrupa por bairro
    el.innerHTML = renderPorBairro(lista);
  } else {
    let html = '';
    cats.forEach(cat=>{
      const sub = lista.filter(i=>i.categoria===cat.key);
      if(!sub.length) return;
      html += `<div class="sec"><div class="sec-label">${cat.label} <em>${sub.length}</em></div>${renderPorBairro(sub)}</div>`;
    });
    // Itens sem categoria conhecida
    const outros = lista.filter(i=>!['lancamento','planta','pronto'].includes(i.categoria));
    if(outros.length) html += `<div class="sec"><div class="sec-label">📁 Drive <em>${outros.length}</em></div><div class="grid">${outros.map(cardHTML).join('')}</div></div>`;
    el.innerHTML = html || `<div class="empty"><p>Nenhum imóvel encontrado.</p></div>`;
  }
}

function renderPorBairro(lista){
  const porBairro = {};
  lista.forEach(i=>{ const b=i.bairro||'Outros'; if(!porBairro[b]) porBairro[b]=[]; porBairro[b].push(i); });
  return Object.entries(porBairro).sort().map(([b,items])=>
    `<div><div class="bairro-label">📍 ${b} <em>${items.length}</em></div><div class="grid">${items.map(cardHTML).join('')}</div></div>`
  ).join('');
}

function labelCat(c){
  return c==='lancamento'?'Lançamento':c==='planta'?'Na planta':c==='pronto'?'Pronto':'Drive';
}

function cardHTML(i){
  const preco = i.preco ? 'R$ '+parseInt(i.preco).toLocaleString('pt-BR') : '';
  const meta = [
    i.m2?`📐 ${i.m2}m²`:'',
    i.quartos?`🛏 ${i.quartos}q`:'',
    i.vagas?`🚗 ${i.vagas}v`:'',
    i.entrega?`📅 ${i.entrega}`:''
  ].filter(Boolean).map(m=>`<span>${m}</span>`).join('');

  return `<div class="card" onclick="abrirDetalhe('${i.id}')">
    <div class="thumb">
      ${i.foto?`<img src="${i.foto}" alt="${i.nome}" onerror="this.style.display='none'">`:``}
      <svg class="thumb-icon" width="44" height="44" viewBox="0 0 44 44" fill="none"><path d="M7 36V15L22 7l15 8v21" stroke="white" stroke-width="2.5" stroke-linejoin="round"/><path d="M15 36V27h14v9" stroke="white" stroke-width="2.5" stroke-linejoin="round"/></svg>
      <span class="cat-tag cat-${i.categoria||'drive'}">${labelCat(i.categoria)}</span>
      ${i.source==='drive'?`<span class="drive-tag">📁 Drive</span>`:''}
    </div>
    <div class="cbody">
      <div class="cnome">${i.nome}</div>
      <div class="cbairro">📍 ${i.bairro||''}${i.cidade&&i.cidade!=='João Pessoa'?' · '+i.cidade:''}</div>
      ${meta?`<div class="cmeta">${meta}</div>`:''}
      ${preco?`<div class="cpreco">${preco} <small>a partir de</small></div>`:'<div style="height:6px"></div>'}
      <div class="cactions" onclick="event.stopPropagation()">
        <button class="btn btn-blue btn-sm" onclick="abrirDetalhe('${i.id}')">Ver detalhes</button>
        ${i.wpp?`<a class="btn btn-green btn-sm" href="https://wa.me/${i.wpp}?text=Olá!%20Tenho%20interesse%20no%20${encodeURIComponent(i.nome)}" target="_blank">💬</a>`:''}
        ${i.driveUrl?`<a class="btn btn-light btn-sm" href="${i.driveUrl}" target="_blank" title="Abrir no Drive">📁</a>`:''}
      </div>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════
// DETALHE
// ═══════════════════════════════════════════
function abrirDetalhe(id){
  const i = todos().find(x=>x.id==id);
  if(!i) return;
  document.getElementById('det-nome').textContent = i.nome;
  const preco = i.preco ? 'R$ '+parseInt(i.preco).toLocaleString('pt-BR') : '—';
  const links = [
    i.book?`<a href="${i.book}" target="_blank" class="flink">📋 Book</a>`:'',
    i.tabela?`<a href="${i.tabela}" target="_blank" class="flink">💰 Tabela</a>`:'',
    i.plantas?`<a href="${i.plantas}" target="_blank" class="flink">📐 Plantas</a>`:'',
    i.fotos?`<a href="${i.fotos}" target="_blank" class="flink">📸 Fotos</a>`:'',
    i.driveUrl?`<a href="${i.driveUrl}" target="_blank" class="flink">📁 Pasta Drive</a>`:'',
  ].filter(Boolean).join('');

  document.getElementById('det-body').innerHTML = `
    ${i.foto?`<img src="${i.foto}" style="width:100%;height:210px;object-fit:cover;border-radius:10px;margin-bottom:14px" onerror="this.style.display='none'">`:``}
    <div class="det-grid">
      <div class="det-item"><label>Bairro</label><span>${i.bairro||'—'}</span></div>
      <div class="det-item"><label>Cidade</label><span>${i.cidade||'João Pessoa'}</span></div>
      <div class="det-item"><label>Categoria</label><span class="cat-tag cat-${i.categoria||'drive'}" style="position:static;font-size:12px">${labelCat(i.categoria)}</span></div>
      <div class="det-item"><label>Preço</label><span style="color:var(--azul);font-size:16px;font-weight:600">${preco}</span></div>
      ${i.construtora?`<div class="det-item"><label>Construtora</label><span>${i.construtora}</span></div>`:''}
      ${i.m2?`<div class="det-item"><label>Metragem</label><span>${i.m2} m²</span></div>`:''}
      ${i.quartos?`<div class="det-item"><label>Quartos</label><span>${i.quartos}</span></div>`:''}
      ${i.vagas?`<div class="det-item"><label>Vagas</label><span>${i.vagas}</span></div>`:''}
      ${i.entrega?`<div class="det-item"><label>Entrega</label><span>${i.entrega}</span></div>`:''}
    </div>
    ${i.desc?`<div class="det-desc">${i.desc}</div>`:''}
    ${links?`<div class="files"><h4>📁 Arquivos</h4><div class="flinks">${links}</div></div>`:''}
    <div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap">
      ${i.wpp?`<a class="btn btn-green" href="https://wa.me/${i.wpp}?text=Olá!%20Tenho%20interesse%20no%20${encodeURIComponent(i.nome)}" target="_blank">💬 WhatsApp</a>`:''}
      <button class="btn btn-blue" onclick="fecharDetalhe();editarImovel('${i.id}')">✏️ Editar</button>
      ${i.source!=='drive'?`<button class="btn btn-danger" onclick="deletar('${i.id}')">🗑️ Remover</button>`:''}
    </div>`;
  document.getElementById('ov-det').classList.add('open');
}
function fecharDetalhe(){ document.getElementById('ov-det').classList.remove('open'); }

// ═══════════════════════════════════════════
// CADASTRO
// ═══════════════════════════════════════════
function abrirCadastro(){
  editId = null;
  document.getElementById('cad-title').textContent = 'Cadastrar Imóvel';
  ['c-nome','c-bairro','c-const','c-preco','c-m2','c-qtos','c-vagas','c-entrega','c-desc','c-foto','c-book','c-tabela','c-plantas','c-fotos','c-wpp'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('c-cidade').value='João Pessoa';
  document.getElementById('c-cat').value='lancamento';
  document.getElementById('cad-err').style.display='none';
  document.getElementById('ov-cad').classList.add('open');
}
function editarImovel(id){
  const i = todos().find(x=>x.id==id);
  if(!i) return;
  editId = id;
  document.getElementById('cad-title').textContent = 'Editar Imóvel';
  document.getElementById('c-nome').value   = i.nome||'';
  document.getElementById('c-cidade').value = i.cidade||'João Pessoa';
  document.getElementById('c-bairro').value = i.bairro||'';
  document.getElementById('c-cat').value    = i.categoria||'planta';
  document.getElementById('c-const').value  = i.construtora||'';
  document.getElementById('c-preco').value  = i.preco||'';
  document.getElementById('c-m2').value     = i.m2||'';
  document.getElementById('c-qtos').value   = i.quartos||'';
  document.getElementById('c-vagas').value  = i.vagas||'';
  document.getElementById('c-entrega').value= i.entrega||'';
  document.getElementById('c-desc').value   = i.desc||'';
  document.getElementById('c-foto').value   = i.foto||'';
  document.getElementById('c-book').value   = i.book||'';
  document.getElementById('c-tabela').value = i.tabela||'';
  document.getElementById('c-plantas').value= i.plantas||'';
  document.getElementById('c-fotos').value  = i.fotos||'';
  document.getElementById('c-wpp').value    = i.wpp||'';
  document.getElementById('cad-err').style.display='none';
  document.getElementById('ov-cad').classList.add('open');
}
function fecharCadastro(){ document.getElementById('ov-cad').classList.remove('open'); editId=null; }

function salvar(){
  const nome   = document.getElementById('c-nome').value.trim();
  const bairro = document.getElementById('c-bairro').value.trim();
  const err    = document.getElementById('cad-err');
  if(!nome||!bairro){ err.textContent='Nome e bairro são obrigatórios.'; err.style.display='block'; return; }

  const obj = {
    id: editId || Date.now().toString(),
    source: 'manual',
    nome, bairro,
    cidade:      document.getElementById('c-cidade').value,
    categoria:   document.getElementById('c-cat').value,
    construtora: document.getElementById('c-const').value.trim(),
    preco:       document.getElementById('c-preco').value||null,
    m2:          document.getElementById('c-m2').value.trim(),
    quartos:     document.getElementById('c-qtos').value.trim(),
    vagas:       document.getElementById('c-vagas').value.trim(),
    entrega:     document.getElementById('c-entrega').value.trim(),
    desc:        document.getElementById('c-desc').value.trim(),
    foto:        document.getElementById('c-foto').value.trim(),
    book:        document.getElementById('c-book').value.trim(),
    tabela:      document.getElementById('c-tabela').value.trim(),
    plantas:     document.getElementById('c-plantas').value.trim(),
    fotos:       document.getElementById('c-fotos').value.trim(),
    wpp:         document.getElementById('c-wpp').value.trim(),
    createdAt:   new Date().toISOString()
  };

  if(editId){
    // Pode ser manual ou drive
    const idxD = driveItens.findIndex(x=>x.id==editId);
    const idxM = imoveis.findIndex(x=>x.id==editId);
    if(idxD>=0) driveItens[idxD]={...driveItens[idxD],...obj};
    if(idxM>=0) imoveis[idxM]={...imoveis[idxM],...obj};
    toast('Imóvel atualizado!');
  } else {
    imoveis.unshift(obj);
    toast('Imóvel cadastrado!');
  }
  localStorage.setItem('differi_imoveis', JSON.stringify(imoveis));
  localStorage.setItem('differi_drive', JSON.stringify(driveItens));
  fecharCadastro();
  render();
}

function deletar(id){
  if(!confirm('Remover este imóvel?')) return;
  imoveis = imoveis.filter(x=>x.id!=id);
  localStorage.setItem('differi_imoveis', JSON.stringify(imoveis));
  fecharDetalhe();
  render();
  toast('Removido.');
}

// ═══════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════
function setTab(t, el){
  tabAtiva = t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  render();
}
function toast(msg, dur=2500){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  setTimeout(()=>t.style.display='none', dur);
}
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',function(e){
  if(e.target===this) this.classList.remove('open');
}));

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
render();
// Auto-sync se passou mais de 1 hora
const lastSync = parseInt(localStorage.getItem('differi_sync_ts')||'0');
if(Date.now()-lastSync > 60*60*1000 || !driveItens.length){
  setTimeout(sincronizarDrive, 800);
}
</script>
</body>
</html>
